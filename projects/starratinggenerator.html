        <canvas id="canvas" hidden></canvas>

        <script>
            let ratingInput = document.querySelector("#rating");
            let ratingCountDisplay = document.querySelector("#ratingCountDisplay");
            let starColorInput = document.querySelector("#starColor");
            let blankStarColorInput = document.querySelector("#blankStarColor");
            let width;

            ratingInput.value = 4.5;
            updateRating();

            ratingInput.addEventListener("input", updateRating);

            function updateRating() {
                rating = ratingInput.value;
                ratingCountDisplay.innerText = rating;

                let colorOverlay = document.getElementById("Color Overlay");
                width = 48 + (rating * 160);
                colorOverlay.setAttribute("d", `m0 0h${width}v256h-${width}z`)
            }

            starColorInput.addEventListener("input", () => {
                document.getElementById("Color Overlay").setAttribute("fill", starColorInput.value);
                document.getElementById("starColorDisplay").innerText = starColorInput.value;
            });

            blankStarColorInput.addEventListener("input", () => {
                document.getElementById("Stars").setAttribute("fill", blankStarColorInput.value);
                document.getElementById("blankStarColorDisplay").innerText = blankStarColorInput.value;
            });

            document.getElementById("downloadSVG").addEventListener("click", () => {
                let svg = document.getElementById("svg");
                let source = new XMLSerializer().serializeToString(svg);
                source = '<?xml version="1.0" standalone="no"?>\r\n' + source;
                let url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(source);
                triggerDownload(url, `${rating} Stars.svg`);
            });

            document.getElementById("downloadPNG").addEventListener("click", () => {
                let svg = document.getElementById("svg");
                let svgData = new XMLSerializer().serializeToString(svg);
                let canvas = document.getElementById("canvas");
                let ctx = canvas.getContext("2d");
                let img = document.createElement("img");
                let svgSize = svg.getBoundingClientRect();
                canvas.width = svgSize.width;
                canvas.height = svgSize.height;
                img.setAttribute("src", "data:image/svg+xml;base64," + btoa(svgData));
                img.onload = function () {
                    ctx.drawImage(img, 0, 0);
                    let imgURI = canvas
                        .toDataURL("image/png")
                        .replace("image/png", "image/octet-stream");
                    triggerDownload(imgURI, `${rating} Stars.png`);
                };
            });

            function triggerDownload(imgURI, name) {
                let evt = new MouseEvent("click", {
                    view: window,
                    bubbles: false,
                    cancelable: true,
                });
                let a = document.createElement("a");
                a.setAttribute("download", name);
                a.setAttribute("href", imgURI);
                a.setAttribute("target", "_blank");
                a.dispatchEvent(evt);
            }
        </script>
